name: Council Task Bridge isolated laboratory
on:
  pull_request:
    paths:
      - 'lab/council-task-bridge/**'
      - 'labapp/**'
      - 'test/lab-independent-package.test.mjs'
      - 'settings.gradle.kts'
      - '.github/workflows/council-task-bridge-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolation-and-mock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm original Council app source is unchanged
        run: node --test test/unified-mobile.test.mjs test/lab-independent-package.test.mjs
      - name: Verify offline bridge interpretation and mocked queue
        run: node --test lab/council-task-bridge/*.test.cjs
      - name: Run Turkish context benchmark
        run: node lab/council-task-bridge/turkish-shadow-benchmark.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Ensure Android SDK platform
        run: |
          test -d "$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build ONLY standalone TEST APK module
        run: gradle :labapp:assembleDebug --no-daemon
      - name: Verify compiled APK identity and zero permissions
        run: |
          APK="labapp/build/outputs/apk/debug/labapp-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/taskbridge-apk-info.txt
          grep -q "package: name='com.atlascouncil.taskbridgelab'" /tmp/taskbridge-apk-info.txt
          grep -q "application-label:'Atha Council TEST'" /tmp/taskbridge-apk-info.txt
          ! "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | grep -E 'android.permission.INTERNET|REQUEST_INSTALL_PACKAGES'
      - name: Upload standalone TEST APK
        uses: actions/upload-artifact@v4
        with:
          name: atha-council-taskbridge-LAB-APK
          path: labapp/build/outputs/apk/debug/*.apk
          retention-days: 7
