name: Atha Council Android APK and signed release
# Atha Council web, Gemini, Copilot UI and ChatGPT handoff are served directly
# by Cloudflare. Never publish a new Android APK for web-only changes.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
  workflow_dispatch:
concurrency:
  group: atha-council-android-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ATLAS_KEYSTORE_BASE64: ${{ secrets.ATLAS_KEYSTORE_BASE64 }}
      ATLAS_KEYSTORE_PASSWORD: ${{ secrets.ATLAS_KEYSTORE_PASSWORD }}
      ATLAS_KEY_ALIAS: ${{ secrets.ATLAS_KEY_ALIAS }}
      ATLAS_KEY_PASSWORD: ${{ secrets.ATLAS_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify unified mobile shell contracts
        run: node --test test/unified-mobile.test.mjs
      - name: Check actual mobile work UI in Chrome
        run: node test/work-ui-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: athalai-work-ui-preview
          path: ui-preview/*.png
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        run: |
          test -d "$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK for internal checks
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: atha-council-debug-test
          path: app/build/outputs/apk/debug/*.apk
      # Repository signing secrets configured; trigger signed production artifact.
      - name: Check signing credentials
        id: signing
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          if [[ -n "$ATLAS_KEYSTORE_BASE64" && -n "$ATLAS_KEYSTORE_PASSWORD" && -n "$ATLAS_KEY_ALIAS" && -n "$ATLAS_KEY_PASSWORD" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets missing; no update APK will be published."
          fi
      - name: Restore permanent signing key
        if: steps.signing.outputs.ready == 'true'
        run: |
          umask 077
          printf '%s' "$ATLAS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/atlas-council-release.jks"
          echo "ATLAS_SIGNING_FILE=$RUNNER_TEMP/atlas-council-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: steps.signing.outputs.ready == 'true'
        run: gradle :app:assembleRelease --stacktrace --no-daemon
      - name: Publish signed APK to stable URL
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk atha-council.apk
          cp atha-council.apk atlas-council-debug.apk
          gh release view latest-debug >/dev/null 2>&1 || gh release create latest-debug --title "Atha Council Android" --notes "Signed Android release" --prerelease
          gh release upload latest-debug atha-council.apk atlas-council-debug.apk --clobber
          gh release edit latest-debug --title "Atha Council Android" --notes "versionCode: ${GITHUB_RUN_NUMBER}"
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/atlas-council-release.jks"
