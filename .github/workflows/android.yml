name: Android APK and download release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        run: |
          test -d "$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk atlas-council-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-council-debug-apk
          path: atlas-council-debug.apk
      - name: Publish direct-download release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-debug --yes --cleanup-tag || true
          git tag -f latest-debug
          git push origin refs/tags/latest-debug --force
          gh release create latest-debug atlas-council-debug.apk --title "Atlas Council Android — Experimental Debug APK" --notes "Experimental Android prototype. ChatGPT and Gemini account integration not yet verified. Do not use production credentials." --prerelease
