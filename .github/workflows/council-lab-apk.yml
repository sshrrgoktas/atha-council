name: Atha Council LAB - separate test APK
on:
  push:
    branches: ['lab/isolated-council-apk-20261118']
    paths:
      - 'app/**'
      - 'test/lab-apk-isolation.test.mjs'
      - '.github/workflows/council-lab-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  council-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure package and OAuth do not touch production
        run: node --test test/lab-apk-isolation.test.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare existing runner Android SDK (known working Council CI path)
        run: |
          test -d "$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile debug-signed Council LAB test APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Verify distinct package and checksum
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "name='com.atlascouncil.app.lab'"
          cp app/build/outputs/apk/debug/app-debug.apk Atha-Council-LAB.apk
          sha256sum Atha-Council-LAB.apk > Atha-Council-LAB-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Atha-Council-LAB-APK
          path: |
            Atha-Council-LAB.apk
            Atha-Council-LAB-SHA256SUMS.txt
          if-no-files-found: error
      - name: Release only to unique LAB prerelease tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "atha-council-lab-$GITHUB_RUN_NUMBER" Atha-Council-LAB.apk Atha-Council-LAB-SHA256SUMS.txt --prerelease --target "$GITHUB_SHA" --title "Atha Council LAB test APK $GITHUB_RUN_NUMBER" --notes "Separate LAB identity com.atlascouncil.app.lab, no production OAuth, no normal APK updates, no installed-app changes."
