name: AthaCouncil
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  AthaCouncil:
    type: application
    platform: iOS
    sources:
      - path: AthaCouncil
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atlascouncil.ios
        PRODUCT_NAME: AthaCouncil
        INFOPLIST_FILE: AthaCouncil/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"
        SUPPORTS_MACCATALYST: NO
  AthaCouncilTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AthaCouncilTests
    dependencies:
      - target: AthaCouncil
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atlascouncil.ios.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AthaCouncil:
    build:
      targets:
        AthaCouncil: all
    test:
      targets:
        - AthaCouncilTests
